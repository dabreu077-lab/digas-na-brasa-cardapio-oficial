<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0c0c">
<title>DIGAS NA BRASA | Sabor que pega fogo!</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0c0c0c;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:28px 15px;background:#171717;border-bottom:2px solid #ff6d00}
.logo{font-size:30px;font-weight:900}
.logo span{color:#ff6d00}
header p{color:#bbb}
h2{color:#ff6d00}
main{max-width:1100px;margin:auto;padding:15px}
.categories{display:flex;gap:9px;overflow-x:auto;padding:15px 0}
.categories button{white-space:nowrap;background:#242424;color:white;border:1px solid #444;padding:12px 16px;border-radius:22px}
.categories button.active{background:#ff6d00;color:#111;border-color:#ff6d00}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:15px}
.card{background:#1e1e1e;border-radius:15px;overflow:hidden;border:1px solid #333}
.card img{width:100%;height:180px;object-fit:contain;background:#292929}
.info{padding:14px}
.info h3{margin:0 0 8px}
.info p{color:#bbb;font-size:14px;min-height:38px}
.price{color:#ff6d00;font-weight:bold;font-size:22px}
button{cursor:pointer}
.add{background:#ff6d00;border:0;border-radius:8px;padding:11px;color:#111;font-weight:bold;width:100%;margin-top:10px}
.cart{position:sticky;bottom:0;background:#181818;border-top:2px solid #ff6d00;padding:14px;text-align:center;margin-top:25px}
.cart button{background:#ff6d00;border:0;padding:14px 24px;border-radius:10px;font-weight:bold}
footer{text-align:center;padding:25px;color:#aaa}

/* DIGAS_CHECKOUT_APK_V1 */
.checkout-overlay{position:fixed;inset:0;background:#000e;z-index:9999;
display:none;overflow-y:auto;padding:16px}
.checkout-box{max-width:520px;margin:20px auto;background:#191919;
border:1px solid #ff6d00;border-radius:16px;padding:20px}
.checkout-box h2{margin-top:0;color:#ff6d00}
.checkout-box label{display:block;margin:14px 0 6px;font-weight:bold}
.checkout-box input,.checkout-box select,.checkout-box textarea{
width:100%;padding:13px;border-radius:8px;border:1px solid #555;
background:#292929;color:white;font-size:16px}
.checkout-box textarea{min-height:75px;resize:vertical}
.checkout-box .choice{display:flex;align-items:center;gap:9px;
font-weight:normal;margin:12px 0}
.checkout-box .choice input{width:auto;accent-color:#ff6d00}
.checkout-box .summary{background:#252525;padding:14px;
border-radius:10px;margin:16px 0;line-height:1.9}
.checkout-box .grand{color:#ff6d00;font-size:21px;font-weight:bold}
.checkout-box .actions{display:flex;gap:10px;margin-top:16px}
.checkout-box .actions button{flex:1;padding:14px;border:0;
border-radius:8px;font-weight:bold}
.checkout-box .send{background:#ff6d00;color:#111}
.checkout-box .cancel{background:#444;color:white}
.checkout-box .hint{color:#bbb;font-size:13px}

</style>
</head>
<body>
<header>
<div class="logo">🔥 DIGAS <span>NA BRASA</span></div>
<p>Sabor que pega fogo!</p>
</header>
<main>
<h2>Nosso cardápio</h2>
<div class="categories" id="categories"></div>
<div class="products" id="products">Carregando cardápio...</div>
</main>
<div class="cart">
<div id="total">0 itens • R$ 0,00</div>
<button onclick="checkout()">FINALIZAR PEDIDO NO WHATSAPP ➜</button>
</div>
<footer>🔥 DIGAS NA BRASA • São Francisco • Minas Gerais</footer>

<div id="digasCheckout" class="checkout-overlay">
 <section class="checkout-box">
  <h2>🔥 FINALIZAR PEDIDO</h2>
  <label for="dcNome">Seu nome</label>
  <input id="dcNome" placeholder="Digite seu nome" autocomplete="name">

  <label for="dcTelefone">Telefone para contato</label>
  <input id="dcTelefone" type="tel" inputmode="tel" placeholder="DDD + número" autocomplete="tel">

  <label>Forma de recebimento</label>
  <select id="dcEntrega">
   <option value="0">Entrega — demais bairros • R$ 3,00</option>
   <option value="1">Entrega — Mirantes • R$ 5,00</option>
   <option value="2">Entrega — Cidade Nova • R$ 5,00</option>
   <option value="3">Entrega — Café no Buli • R$ 5,00</option>
   <option value="4">Retirar na loja • grátis</option>
  </select>

  <div id="dcEnderecoArea">
   <label for="dcEndereco">Endereço completo</label>
   <textarea id="dcEndereco" placeholder="Rua, número, bairro e referência"></textarea>
  </div>
  <div id="dcRetirada" class="hint" style="display:none">
   Retirada: Rua Adão Vieira, 1640, Aparecida
  </div>

  <label>Forma de pagamento</label>
  <select id="dcPagamento">
   <option value="Pix">Pix</option>
   <option value="Cartão na entrega ou retirada">Cartão na entrega ou retirada</option>
   <option value="Dinheiro">Dinheiro</option>
  </select>

  <div id="dcPix" class="hint">
   Pix CNPJ: 62.709.645/0001-55<br>
   Confirme o pedido com a loja antes de pagar.
  </div>

  <div id="dcTrocoArea" style="display:none">
   <label for="dcTroco">Troco para quanto?</label>
   <input id="dcTroco" inputmode="decimal" placeholder="Ex: 100,00">
   <p id="dcTrocoResultado" class="hint"></p>
  </div>

  <label for="dcObs">Observações</label>
  <textarea id="dcObs" placeholder="Alguma observação para o pedido?"></textarea>

  <div class="summary">
   <strong>Itens do pedido</strong>
   <div id="dcItens" style="white-space:pre-line;margin:8px 0 12px"></div>
   <div id="dcSubtotal"></div>
   <div id="dcTaxa"></div>
   <div class="grand" id="dcTotal"></div>
  </div>
  <div class="actions">
   <button class="cancel" onclick="fecharCheckout()">VOLTAR</button>
   <button class="send" onclick="enviarCheckout()">ENVIAR PEDIDO ➜</button>
  </div>
 </section>
</div>

<script>
let products=[],cart={},category="Todos";
const money=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
async function init(){
 products=await (await fetch("./products.json?v="+Date.now(),{cache:"no-store"})).json();
 const cats=["Todos",...new Set(products.map(p=>p.category))];
 document.getElementById("categories").innerHTML=cats.map(c=>
 `<button class="${c==="Todos"?"active":""}" onclick="filter('${c}',this)">${c}</button>`).join("");
 render();
}
function filter(c,b){
 category=c;
 document.querySelectorAll(".categories button").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");render();
}
function render(){
 let list=products.filter(p=>category==="Todos"||p.category===category);
 document.getElementById("products").innerHTML=list.map(p=>`
 <article class="card">
 <img src="${p.image}" alt="${p.name}" loading="lazy">
 <div class="info">
 <h3>${p.name}</h3><p>${p.description}</p>
 <div class="price">${money(p.price)}</div>
 <button class="add" onclick="add(${p.id})">ADICIONAR AO PEDIDO</button>
 ${cart[p.id]?`<p>Quantidade: ${cart[p.id]}</p>`:""}
 </div></article>`).join("");
 update();
}
function add(id){cart[id]=(cart[id]||0)+1;render()}
function update(){
 let qty=Object.values(cart).reduce((a,b)=>a+b,0);
 let total=products.reduce((a,p)=>a+p.price*(cart[p.id]||0),0);
 document.getElementById("total").textContent=`${qty} itens • ${money(total)}`;
}

function checkout(){
 const selected=products.filter(p=>cart[p.id]);
 if(!selected.length){alert("Adicione produtos ao pedido.");return}
 document.getElementById("digasCheckout").style.display="block";
 atualizarCheckout();
}
function fecharCheckout(){
 document.getElementById("digasCheckout").style.display="none";
}
function taxaCheckout(){
 const modo=Number(document.getElementById("dcEntrega").value);
 return modo===4?0:(modo===0?3:5);
}
function subtotalCheckout(){
 return products.reduce((a,p)=>a+p.price*(cart[p.id]||0),0);
}
function valorDigitado(v){
 v=String(v||"").trim().replace(/\s/g,"").replace("R$","");
 if(v.includes(","))v=v.replace(/\./g,"").replace(",",".");
 const n=Number(v);
 return Number.isFinite(n)?n:NaN;
}
function atualizarCheckout(){
 const subtotal=subtotalCheckout(),taxa=taxaCheckout(),total=subtotal+taxa;

 const itens=products.filter(p=>cart[p.id]);
 document.getElementById("dcItens").textContent=itens.length
  ?itens.map(p=>(cart[p.id]+"x "+p.name+" — "+money(p.price*cart[p.id]))).join("\n")
  :"Nenhum produto adicionado";

 document.getElementById("dcSubtotal").textContent="Produtos: "+money(subtotal);
 document.getElementById("dcTaxa").textContent="Entrega: "+money(taxa);
 document.getElementById("dcTotal").textContent="TOTAL: "+money(total);

 const retirada=document.getElementById("dcEntrega").value==="4";
 document.getElementById("dcEnderecoArea").style.display=retirada?"none":"block";
 document.getElementById("dcRetirada").style.display=retirada?"block":"none";

 const pagamento=document.getElementById("dcPagamento").value;
 document.getElementById("dcPix").style.display=pagamento==="Pix"?"block":"none";
 document.getElementById("dcTrocoArea").style.display=pagamento==="Dinheiro"?"block":"none";

 if(pagamento==="Dinheiro")calcularTrocoCheckout();
}
function calcularTrocoCheckout(){
 const recebido=valorDigitado(document.getElementById("dcTroco").value);
 const total=subtotalCheckout()+taxaCheckout();
 const resultado=document.getElementById("dcTrocoResultado");
 if(!Number.isFinite(recebido)){
  resultado.textContent="Informe o valor para troco";return;
 }
 const diferenca=recebido-total;
 resultado.textContent=diferenca>=0?
  "Troco: "+money(diferenca):"Valor insuficiente";
}
function enviarCheckout(){
 const selected=products.filter(p=>cart[p.id]);
 if(!selected.length){alert("Adicione produtos ao pedido.");return}

 const nome=document.getElementById("dcNome").value.trim();
 const telefone=document.getElementById("dcTelefone").value.trim();
 const modo=Number(document.getElementById("dcEntrega").value);
 const endereco=document.getElementById("dcEndereco").value.trim();
 const pagamento=document.getElementById("dcPagamento").value;
 const obs=document.getElementById("dcObs").value.trim();
 const subtotal=subtotalCheckout();
 const taxa=taxaCheckout();
 const total=subtotal+taxa;

 if(!nome){alert("Informe seu nome.");document.getElementById("dcNome").focus();return}
 if(modo!==4&&!endereco){
  alert("Informe seu endereço completo.");
  document.getElementById("dcEndereco").focus();return;
 }

 let recebido=0;
 if(pagamento==="Dinheiro"){
  recebido=valorDigitado(document.getElementById("dcTroco").value);
  if(!Number.isFinite(recebido)||recebido<total){
   alert("Informe um valor em dinheiro igual ou maior que o total.");
   document.getElementById("dcTroco").focus();return;
  }
 }

 const modos=[
  "Entrega — demais bairros • R$ 3,00",
  "Entrega — Mirantes • R$ 5,00",
  "Entrega — Cidade Nova • R$ 5,00",
  "Entrega — Café no Buli • R$ 5,00",
  "Retirar na loja • grátis"
 ];
 const id=Math.random().toString(36).substring(2,10).toUpperCase();
 let msg="*PEDIDO #"+id+" — DIGAS NA BRASA*\n\n";
 msg+="Cliente: "+nome+"\n";
 if(telefone)msg+="Telefone: "+telefone+"\n";
 msg+="\n";
 selected.forEach(p=>{
  msg+=cart[p.id]+"x "+p.name+" — "+money(p.price*cart[p.id])+"\n";
 });
 msg+="\n"+modos[modo]+"\n";
 if(modo===4)msg+="Retirada: Rua Adão Vieira, 1640, Aparecida\n";
 else msg+="Endereço: "+endereco+"\n";
 msg+="\nSubtotal: "+money(subtotal);
 msg+="\nEntrega: "+money(taxa);
 msg+="\n*TOTAL: "+money(total)+"*";
 msg+="\nPagamento: "+pagamento;
 if(pagamento==="Dinheiro"){
  msg+="\nTroco para: "+money(recebido);
  msg+="\nTroco: "+money(recebido-total);
 }
 if(obs)msg+="\nObservações: "+obs;
 msg+="\n\nAguardo a confirmação da loja.";

 const url="https://wa.me/5538999448465?text="+encodeURIComponent(msg);
 window.location.href=url;
}
document.getElementById("dcEntrega").addEventListener("change",atualizarCheckout);
document.getElementById("dcPagamento").addEventListener("change",atualizarCheckout);
document.getElementById("dcTroco").addEventListener("input",calcularTrocoCheckout);
document.getElementById("digasCheckout").addEventListener("click",e=>{
 if(e.target.id==="digasCheckout")fecharCheckout();
});

init().catch(()=>document.getElementById("products").textContent="Erro ao carregar o cardápio.");
</script>
</body>
</html>
